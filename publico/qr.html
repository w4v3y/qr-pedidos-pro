<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprimir QRs — QR Pedidos</title>
<link rel="stylesheet" href="/estilos.css">
<style>
  .grid-qr{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .qr-mesa{background:#fff;border:2px dashed var(--borde);border-radius:16px;padding:20px;text-align:center;page-break-inside:avoid}
  .qr-mesa h3{margin-bottom:4px}
  .qr-mesa p{font-size:12px;color:var(--gris);margin-bottom:12px;word-break:break-all}
  .qr-mesa .codigo{display:flex;justify-content:center;margin-bottom:8px}
  .controles{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .controles input{width:80px;padding:9px;border:1px solid var(--borde);border-radius:10px;font-size:15px}
  @media print{ .no-print{display:none} body{background:#fff} .qr-mesa{border-color:#999} }
</style>
</head>
<body>
<div class="panel">
  <div class="panel-head no-print">
    <div>
      <h2>🖨️ Códigos QR por mesa</h2>
      <p class="sub">Imprime estos códigos y pégalos en cada mesa. Al escanearlos, el cliente entra directo a la carta de SU mesa.</p>
    </div>
  </div>
  <div class="controles no-print">
    <label>N.º de mesas: <input type="number" id="numMesas" value="12" min="1" max="99"></label>
    <button class="btn btn-rojo" onclick="generar()">Generar</button>
    <button class="btn btn-carbon" onclick="window.print()">🖨️ Imprimir</button>
  </div>
  <div class="card no-print" id="infoRed" style="border-left:5px solid var(--verde)">
    <b>📶 Dirección para los celulares:</b> <span id="baseUrl">detectando...</span><br>
    <span class="sub">Los QR de abajo ya usan esta dirección. Los celulares deben estar conectados a la misma red WiFi que esta computadora.</span>
  </div>
  <p class="sub no-print" id="aviso" style="margin-bottom:14px"></p>
  <div class="grid-qr" id="grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let BASE = location.origin;
async function detectarBase(){
  try{
    const r = await fetch('/api/info');
    BASE = (await r.json()).base;
  }catch(_){ /* si falla, se usa la dirección actual */ }
  document.getElementById('baseUrl').textContent = BASE;
  generar();
}
function generar(){
  const n = Math.max(1, Math.min(99, Number(document.getElementById('numMesas').value)||12));
  const base = BASE;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const hayLib = typeof QRCode !== 'undefined';
  document.getElementById('aviso').textContent = hayLib ? '' :
    '⚠️ No hay conexión a internet: no se pudo cargar la librería de QR. Conéctate una vez para generar e imprimir los códigos (luego ya no hace falta internet).';
  for (let i=1; i<=n; i++){
    const url = `${base}/mesa/${i}`;
    const div = document.createElement('div');
    div.className = 'qr-mesa';
    div.innerHTML = `<h3>Mesa ${i}</h3><p>${url}</p><div class="codigo" id="qr${i}"></div>
      <p style="margin:0;font-size:13px;color:var(--carbon)">📱 Escanea para pedir</p>`;
    grid.appendChild(div);
    if (hayLib) new QRCode(document.getElementById('qr'+i), { text:url, width:150, height:150, correctLevel:QRCode.CorrectLevel.M });
  }
}
detectarBase();
</script>
</body>
</html>
